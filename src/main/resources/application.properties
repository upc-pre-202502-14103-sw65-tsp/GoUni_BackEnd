#Spring Application Name
spring.application.name=goni-platform

spring.datasource.url=jdbc:mysql://localhost:3306/springdb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Spring Data JPA Configuration
spring.jpa.show-sql=true

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy=com.studentconnect.gouni.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# Application Information for Documentation

# Elements take their values from maven pom.xml build-related information
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY}
stripe.publishable.key=pk_test_51QC7YA2N0BisYvgM9UWp8BbV58J0FYDnkVpuhMT8i3KIVS22WiD8R0MCYoOcvtrQgeDT4uEaJIg7Umyw7favKCH900mUtyqzcE
stripe.webhook.secret=whsec_your_webhook_secret_here

# JWT Configuration Properties
authorization.jwt.secret = WriteHereYourSecretStringForTokenSigningCredentials
authorization.jwt.expiration.days = 7

# Mail configuration (dev defaults)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Redis Session
spring.session.store-type=redis

# Allow payment intents without authentication in default profile (local dev)
# Dev profile also enables this; prod overrides to false.
security.permit.payment-intents=true
security.permit.emails=true